name: Build mobile review packages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: mobile-build-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - run: npm ci
      - run: npm test
      - run: npm run build && npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug assembleRelease bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: DuctCheckerPro-5.3.0-Android
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: xcodebuild -version
      - run: npm ci && npm run build && npx cap sync ios
        env:
          DUCT_IOS_RELEASE: "1"
      - run: bash scripts/build-ios.sh
      - uses: actions/upload-artifact@v4
        with:
          name: DuctCheckerPro-5.2.0-iOS-unsigned
          path: artifacts/ios/*.zip

  upload_ios_review:
    if: github.repository == 'siscomdiuehoa/Duct-checker' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/review/ios-upload-520'
    environment: ios-release
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Download verified signed IPA
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: DuctCheckerPro-iOS-5.2.0-50300-signed
          run-id: 42050264234
          github-token: ${{ github.token }}
          path: signed
      - name: Verify and upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          umask 077
          : "${ASC_KEY_ID:?Missing ASC key ID}" "${ASC_ISSUER_ID:?Missing ASC issuer ID}" "${ASC_PRIVATE_KEY_BASE64:?Missing ASC API key}"
          [[ "$ASC_KEY_ID" =~ ^[A-Z0-9]{10}$ ]]
          ipa="signed/DuctCheckerPro-5.2.0.ipa"
          echo "d48c5e0d5619f973657b26f6be73316953cb258af301099ab4bef073e7d30a05  $ipa" | shasum -a 256 -c -
          tmp=$(mktemp -d "$RUNNER_TEMP/asc-upload.XXXXXXXX")
          trap 'rm -rf "$tmp"' EXIT
          ditto -x -k "$ipa" "$tmp/unpacked"
          apps=("$tmp/unpacked/Payload/"*.app)
          [[ ${#apps[@]} == 1 && -d "${apps[0]}" ]]
          codesign --verify --deep --strict "${apps[0]}"
          export API_PRIVATE_KEYS_DIR="$tmp/keys"
          mkdir -p "$API_PRIVATE_KEYS_DIR"
          printf '%s' "$ASC_PRIVATE_KEY_BASE64" | base64 -D > "$API_PRIVATE_KEYS_DIR/AuthKey_$ASC_KEY_ID.p8"
          unset ASC_PRIVATE_KEY_BASE64
          xcrun altool --upload-app --type ios --file "$ipa" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
