name: Build mobile review packages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      operation:
        description: Select sign or upload
        type: choice
        options: [sign, upload]
        default: sign
concurrency:
  group: mobile-build-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - run: npm ci
      - run: npm test
      - run: npm run build && npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug assembleRelease bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: DuctCheckerPro-5.3.0-Android
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: xcodebuild -version
      - run: npm ci && npm run build && npx cap sync ios
        env:
          DUCT_IOS_RELEASE: "1"
      - run: bash scripts/build-ios.sh
      - uses: actions/upload-artifact@v4
        with:
          name: DuctCheckerPro-5.2.0-iOS-unsigned
          path: artifacts/ios/*.zip

  signed_ios_review:
    if: github.repository == 'siscomdiuehoa/Duct-checker' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/review/ios-sign-branch-run' && inputs.operation == 'sign'
    environment: ios-release
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Prepare reviewed release sources
        env:
          DUCT_IOS_RELEASE: '1'
        run: |
          set -euo pipefail
          xcodebuild -version
          npm ci
          npm test
          npm run build
          npx --no-install cap sync ios
      - name: Sign, export locally and verify
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_APPSTORE_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
        run: bash scripts/sign-ios-release.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DuctCheckerPro-iOS-5.2.0-50300-signed
          path: artifacts/signed/DuctCheckerPro-5.2.0.ipa
          if-no-files-found: error
          retention-days: 1

  upload_ios_review:
    if: github.repository == 'siscomdiuehoa/Duct-checker' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/review/ios-sign-branch-run' && inputs.operation == 'upload'
    environment: ios-release
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Download verified signed IPA
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: DuctCheckerPro-iOS-5.2.0-50300-signed
          run-id: 42050264234
          github-token: ${{ github.token }}
          path: signed
      - name: Verify and upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          umask 077
          : "${ASC_KEY_ID:?Missing ASC key ID}" "${ASC_ISSUER_ID:?Missing ASC issuer ID}" "${ASC_PRIVATE_KEY_BASE64:?Missing ASC API key}"
          [[ "$ASC_KEY_ID" =~ ^[A-Z0-9]{10}$ ]]
          ipa="signed/DuctCheckerPro-5.2.0.ipa"
          echo "d48c5e0d5619f973657b26f6be73316953cb258af301099ab4bef073e7d30a05  $ipa" | shasum -a 256 -c -
          tmp=$(mktemp -d "$RUNNER_TEMP/asc-upload.XXXXXXXX")
          trap 'rm -rf "$tmp"' EXIT
          ditto -x -k "$ipa" "$tmp/unpacked"
          apps=("$tmp/unpacked/Payload/"*.app)
          [[ ${#apps[@]} == 1 && -d "${apps[0]}" ]]
          codesign --verify --deep --strict "${apps[0]}"
          export API_PRIVATE_KEYS_DIR="$tmp/keys"
          mkdir -p "$API_PRIVATE_KEYS_DIR"
          printf '%s' "$ASC_PRIVATE_KEY_BASE64" | base64 -D > "$API_PRIVATE_KEYS_DIR/AuthKey_$ASC_KEY_ID.p8"
          unset ASC_PRIVATE_KEY_BASE64
          xcrun altool --upload-app --type ios --file "$ipa" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
