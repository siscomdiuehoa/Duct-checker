name: Sign iOS 5.2.0 for owner review
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    if: github.repository == 'siscomdiuehoa/Duct-checker' && github.ref == 'refs/heads/main'
    environment: ios-release
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Prepare reviewed release sources
        env:
          DUCT_IOS_RELEASE: '1'
        run: |
          set -euo pipefail
          xcodebuild -version
          npm ci
          npm test
          npm run build
          npx --no-install cap sync ios
      - name: Sign, export locally and verify
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_APPSTORE_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
        run: bash scripts/sign-ios-release.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DuctCheckerPro-iOS-5.2.0-50300-signed
          path: artifacts/signed/DuctCheckerPro-5.2.0.ipa
          if-no-files-found: error
          retention-days: 1
