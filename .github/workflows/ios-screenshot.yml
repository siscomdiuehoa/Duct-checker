name: Capture iOS Simulator
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  screenshot:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/download-artifact@v4
        with:
          name: DuctCheckerPro-5.3.0-iOS-unsigned
          run-id: 41861128144
          github-token: ${{ github.token }}
          path: packages
      - name: Launch actual iOS app and capture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p screenshots app
          ditto -x -k packages/DuctCheckerPro-5.3.0-simulator.app.zip app
          xcrun simctl list devices available -j > devices.json
          DEVICE=$(python3 -c 'import json;d=json.load(open("devices.json"));print(next(x["udid"] for v in reversed(list(d["devices"].values())) for x in v if "iPhone 17 Pro Max" in x["name"] and x.get("isAvailable")))')
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl status_bar "$DEVICE" override --time 9:41 --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState charged --batteryLevel 100
          xcrun simctl install "$DEVICE" app/App.app
          xcrun simctl launch "$DEVICE" vn.siscom.ductcheckerpro
          sleep 15
          xcrun simctl io "$DEVICE" screenshot screenshots/DuctCheckerPro-5.3.0-iOS.png
          xcrun simctl terminate "$DEVICE" vn.siscom.ductcheckerpro
          cp app/App.app/public/app.js app-original.js
          # Screenshot harness only: choose the initial tab in the downloaded simulator copy.
          # Repository UI and release artifacts are untouched.
          for PAGE in outlets settings; do
            python3 -c "from pathlib import Path; p=Path('app/App.app/public/app.js'); s=Path('app-original.js').read_text(); assert \"page:'duct'\" in s; p.write_text(s.replace(\"page:'duct'\", \"page:'$PAGE'\", 1))"
            xcrun simctl install "$DEVICE" app/App.app
            xcrun simctl launch "$DEVICE" vn.siscom.ductcheckerpro
            sleep 8
            xcrun simctl io "$DEVICE" screenshot "screenshots/DuctCheckerPro-5.3.0-iOS-$PAGE.png"
            xcrun simctl terminate "$DEVICE" vn.siscom.ductcheckerpro
          done
          xcrun simctl list devices booted > screenshots/device.txt
      - uses: actions/upload-artifact@v4
        with:
          name: DuctCheckerPro-5.3.0-iOS-screenshot
          path: screenshots/
